name: ci
on: {push: {branches: [main]}}
permissions: {contents: read, packages: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm install && npm audit --audit-level=high || true
      - run: npm run build
      - run: docker build -t ghcr.io/${{ github.repository_owner }}/dz-import:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: "ghcr.io/${{ github.repository_owner }}/dz-import:${{ github.sha }}", severity: "CRITICAL", exit-code: "1"}
      - run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/dz-import:${{ github.sha }}
