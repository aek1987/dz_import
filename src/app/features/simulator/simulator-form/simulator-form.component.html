@let f = store.form();
@let cur = store.currency();

<form (submit)="$event.preventDefault()">
  <fieldset class="card">
    <legend>1. Véhicule</legend>
   <div class="two">
  <div>
    <label for="marque">Marque</label>
    <select id="marque" (change)="store.setMarque($any($event.target).value)">
      <option value="">Choisir…</option>
      @for (m of store.marques; track m) {
      <option [value]="m" [selected]="m === f.marque">{{ m }}</option>
      }
    </select>
  </div>
  <div>
    <label for="modele">Modèle</label>
    <select id="modele" [disabled]="!f.marque"
      (change)="store.patch({ modele: $any($event.target).value })">
      <option value="">Choisir…</option>
      @for (mo of store.modeles(); track mo) {
      <option [value]="mo" [selected]="mo === f.modele">{{ mo }}</option>
      }
    </select>
  </div>
</div>

    <app-segmented label="État du véhicule" [options]="types" [value]="store.type()"
      (valueChange)="store.type.set($event)" />
    <label for="sp">Motorisation et cylindrée</label>
    <select id="sp" (change)="onLine($event)">
      @for (s of store.tariff; track s.code) {
      <option [selected]="s === store.line()">{{ s.label }} (SH {{ s.code }})</option>
      }
    </select>


    <p class="hint">Droit de douane appliqué : {{ f.dd }} %</p>
  </fieldset>

  <fieldset class="card">
    <legend>2. Prix et transport</legend>
    <app-segmented label="Devise" [options]="currencies" [value]="cur" (valueChange)="store.setCurrency($event)" />
    <app-number-field id="fob" label="Prix d’achat du véhicule (FOB)" [unit]="cur" [value]="f.fob"
      (valueChange)="store.patch({ fob: $event })" />
    <div class="two">
      <app-number-field id="fret" label="Fret maritime" [unit]="cur" [value]="f.fret"
        (valueChange)="store.patch({ fret: $event })" />
      <app-number-field id="ass" label="Assurance" unit="% FOB" step="0.01" [value]="f.assPct"
        (valueChange)="store.patch({ assPct: $event })" />
    </div>
   
    <app-number-field id="fx" label="Taux de change" [unit]="'DA pour 1 ' + cur" step="0.01" [value]="f.fx"
      (valueChange)="store.patch({ fx: $event })" />
    
    <app-number-field id="frais" label="Port, transitaire, homologation" unit="DA" [value]="f.frais"
      (valueChange)="store.patch({ frais: $event })" />
  </fieldset>

  <details class="card adv">
    <summary>3. Taux de taxes (modifiables)</summary>
    <div class="two">
      <app-number-field id="dd" label="Droit de douane" unit="%" step="0.01" [value]="f.dd"
        (valueChange)="store.patch({ dd: $event })" />
      <app-number-field id="tcs" label="TCS" unit="%" step="0.01" [value]="f.tcs"
        (valueChange)="store.patch({ tcs: $event })" />
      <app-number-field id="tva" label="TVA" unit="%" step="0.01" [value]="f.tva"
        (valueChange)="store.patch({ tva: $event })" />
      <app-number-field id="tic" label="Taxe additionnelle (TIC)" unit="%" step="0.01" [value]="f.tic"
        (valueChange)="store.patch({ tic: $event })" />
      <app-number-field id="red" label="Redevance douanière" unit="%" step="0.01" [value]="f.red"
        (valueChange)="store.patch({ red: $event })" />
    </div>
  </details>
</form>
